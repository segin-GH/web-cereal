<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="./style.css">
  <link rel="stylesheet" href="node_modules/@xterm/xterm/css/xterm.css" />
  <script src="node_modules/@xterm/xterm/lib/xterm.js"></script>
  <title>cereal App</title>
</head>

<body class="bg-gray-800">

  <main class="flex">
    <nav class="bg-bg1 w-12 h-screen">
      <ul class="flex flex-col text-white font-bold">
        <li class="block w-12 p-4 hover:bg-pri border-l-2 border-acc" data-page="./usb/usb">
          <a href="#">
            <img src="public/usb.svg" alt="usb" />
          </a>
        </li>
        <li class="w-12 p-4 hover:bg-pri" data-page="./wifi/wifi">
          <a href="#">
            <img src="public/wifi.svg" alt="wifi" />
          </a>
        </li>
        <li class="w-12 p-4 hover:bg-pri" data-page="./ble/ble">
          <a href="#">
            <img src="public/ble.svg" alt="ble" />
          </a>
        </li>
        <li class="w-12 p-4 hover:bg-pri" data-page="./mqtt/mqtt">
          <a href="#">
            <img src="public/mqtt.svg" alt="mqtt" />
          </a>
        </li>
      </ul>
    </nav>

    <div id="content-area" class="flex bg-green-100 w-full">
      <div id="control-center" class="flex flex-col flex-initial bg-bg1 w-1/5 text-txt">
        <div class="flex flex-row flex-initial p-1 text-xs rounded-sm border border-pri">
          <button id="butt-term" class="basis-1/2 m-1 mr-0 p-1 rounded-sm bg-acc">
            Term
          </button>

          <button id="butt-plot" class="basis-1/2 m-1 p-1 rounded-sm bg-bg3">
            Plot
          </button>
        </div>

        <div id="term-ctrl" class=" grow  mt-1 p-1 rounded-sm text-xs border border-pri">
          <button id="dropDownSerialPort" data-dropdown-toggle="dropdownUSB"
            class="w-full rounded-sm px-2 py-1.5 text-center inline-flex items-center justify-between bg-bg3"
            type="button">
            <span id="dropdownUSBPortText">Port</span>
            <svg class="ml-2 w-2 h-2" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" fill="none"
              viewBox="0 0 10 6">
              <path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                d="m1 1 4 4 4-4" />
            </svg>
          </button>

        </div>

        <div id="plot-ctrl" class="hidden grow m-1 mt-0 rounded-sm bg-slate-800">
          plot
        </div>
      </div>

      <div id="terminal" class="text-black bg-zinc-500 w-full">
      </div>
    </div>
  </main>

  <script type="module" src="./main.js"></script>
</body>

</html>
